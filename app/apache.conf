<VirtualHost *:80>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        # Enruta cualquier URL inexistente al front controller.
        FallbackResource /index.php
    </Directory>

    # Nunca servir el código fuente ni las plantillas directamente.
    <DirectoryMatch "/var/www/html/(src|views)">
        Require all denied
    </DirectoryMatch>

    ErrorLog  ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
