services:
  db:
    image: postgres:17-alpine
    container_name: pagos_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-pagos}
      POSTGRES_USER: ${DB_USER:-pagos}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pagos_secret}
      TZ: America/Mexico_City
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-pagos} -d ${DB_NAME:-pagos}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - pagos_net

  app:
    build: ./app
    container_name: pagos_app
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-pagos}
      DB_USER: ${DB_USER:-pagos}
      DB_PASSWORD: ${DB_PASSWORD:-pagos_secret}
      APP_ENV: ${APP_ENV:-production}
      TZ: America/Mexico_City
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      # Montaje para desarrollo en vivo (edita y recarga sin reconstruir la imagen)
      - ./app/public:/var/www/html/public
      - ./app/src:/var/www/html/src
      - ./app/views:/var/www/html/views
    networks:
      - pagos_net

volumes:
  pgdata:

networks:
  pagos_net:
    driver: bridge
